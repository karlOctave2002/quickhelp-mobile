<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Quick Help</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root>
    <!-- Pantalla de carga: se ve hasta que Angular muestra el login (Angular la reemplaza). -->
    <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
                justify-content: center; background: linear-gradient(145deg, #f52b43, #cf102c);
                color: #fff; font-family: Arial, sans-serif; text-align: center;">
      <div style="display: grid; place-items: center; width: 72px; height: 72px; margin-bottom: 16px;
                  border: 1px solid rgb(255 255 255 / 35%); border-radius: 24px; background: rgb(255 255 255 / 12%);">
        <svg viewBox="0 0 48 48" width="50" height="50" aria-hidden="true">
          <path d="M5 25H14L20 12L28 36L34 25H43" fill="none" stroke="#fff" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div style="font-size: 52px; line-height: 1.1; letter-spacing: -2px;">Quick<b>Help</b></div>
      <p style="margin: 12px 0 0; font-size: 15px;">Tu red de apoyo, contigo.</p>
    </div>
  </app-root>
</body>

</html>
